<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KYY FILTER STUDIO</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--card:#14141c;--line:#262634;--pu:#a855f7;--pu2:#7c3aed;--mut:#8b8b9e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.12em;font-size:15px;margin-right:auto;background:linear-gradient(90deg,#fff,var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);transition:.2s;font-weight:600}
.btn:hover{border-color:var(--pu)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--pu),var(--pu2));border-color:transparent;box-shadow:0 4px 18px #7c3aed55}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0;background:radial-gradient(ellipse at 50% 0,#1b1233,transparent 70%)}
#cv{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px #000a;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}}
#empty{text-align:center;max-width:300px;padding:30px;border:2px dashed var(--line);border-radius:24px;transition:.2s}
#empty.drag{border-color:var(--pu);background:#a855f71a}
#empty h2{margin:12px 0 6px;font-size:18px}#empty p{margin:0 0 18px;color:var(--mut)}
.big{width:44px;height:44px;color:var(--pu)}
.badge{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:#000b;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.1em;opacity:0;transition:.2s;pointer-events:none}
.badge.on{opacity:1}
.cmp{position:absolute;bottom:22px;right:22px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;background:#000b;backdrop-filter:blur(8px)}
.panel{background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;padding:6px 10px 0;gap:4px}
.tab{flex:1;padding:10px;border-bottom:2px solid transparent;color:var(--mut);font-weight:600;transition:.2s}
.tab.on{color:#fff;border-color:var(--pu)}
.body{padding:12px 14px 16px;overflow:auto;max-height:36vh}
.pane{display:none}.pane.on{display:block;animation:in .25s ease}
.off{opacity:.4;pointer-events:none}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.th{flex:none;width:76px;text-align:center;font-size:11px;color:var(--mut);transition:.2s}
.th canvas{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid transparent;display:block;margin-bottom:5px;transition:.2s;background:#222}
.th.on{color:#fff}.th.on canvas{border-color:var(--pu);box-shadow:0 0 14px #a855f788}
.sl{margin:8px 0}.sl div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.sl b{color:var(--pu);font-weight:600}
input[type=range]{width:100%;height:22px;-webkit-appearance:none;appearance:none;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--pu)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--pu)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:8px 13px;border-radius:99px;background:#0d0d13;border:1px solid var(--line);font-weight:600;transition:.2s}
.chip.on{background:var(--pu2);border-color:var(--pu)}
select{background:#0d0d13;color:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 8px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){
 .app{grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr)}
 header{grid-column:1/-1}
 .panel{border-top:0;border-left:1px solid var(--line)}
 .body{max-height:none;flex:1}
 .stage{padding:28px}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="logo">KYY FILTER STUDIO</div>
  <button class="btn" id="pick"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span>Foto</span></button>
  <button class="btn off" id="reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg><span>Reset</span></button>
  <button class="btn pri off" id="dl"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg><span>Simpan</span></button>
 </header>
 <div class="stage" id="stage">
  <div id="empty">
   <svg class="big" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
   <h2>Mulai edit fotomu</h2><p>Pilih foto dari galeri atau seret ke sini. Semua diproses di perangkatmu.</p>
   <button class="btn pri" id="pick2">Pilih Foto</button>
  </div>
  <canvas id="cv" hidden></canvas>
  <div class="badge" id="badge">BEFORE</div>
  <button class="btn cmp off" id="cmp"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Tahan: Before</span></button>
 </div>
 <div class="panel off" id="panel">
  <div class="tabs"><button class="tab on" data-t="f">Filter</button><button class="tab" data-t="a">Adjust</button><button class="tab" data-t="c">Crop</button></div>
  <div class="body">
   <div class="pane on" id="p-f"><div class="thumbs" id="thumbs"></div><div class="sl"><div><span>Intensitas filter</span><b id="v_inten">100</b></div><input type="range" id="inten" min="0" max="100" value="100"></div></div>
   <div class="pane" id="p-a"></div>
   <div class="pane" id="p-c">
    <div class="row">
     <button class="btn" id="rl"><svg viewBox="0 0 24 24"><path d="M3 2v6h6M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>Kiri</button>
     <button class="btn" id="rr"><svg viewBox="0 0 24 24"><path d="M21 2v6h-6M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>Kanan</button>
     <button class="btn" id="fl"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5V7zM16 7l5 5-5 5V7z"/></svg>Flip</button>
    </div>
    <div class="row" id="ratios"></div>
    <div id="cs"></div>
   </div>
   <div class="row" style="margin:12px 0 0;align-items:center"><span style="color:var(--mut)">Format unduhan</span><select id="fmt"><option value="image/jpeg">JPG (kualitas tinggi)</option><option value="image/png">PNG (tanpa kompresi)</option></select></div>
  </div>
 </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const D={b:0,c:1,s:1,sep:0,gray:0,t:0,sp:0,f:0,tr:0,tg:0,tb:0,v:0,gl:0};
const F=[
['Original',{}],
['Instagram Classic',{c:1.1,s:1.15,b:4,t:6,v:.25}],
['Vintage',{sep:.5,f:28,c:.9,s:.8,t:8,v:.4}],
['Retro',{s:1.3,f:22,t:14,tr:10,tg:2,tb:-8,c:1.08,v:.3}],
['Cinematic',{c:1.2,s:.9,sp:44,v:.45,b:-4}],
['Black & White',{gray:1,c:1.15,v:.15}],
['Warm Tone',{t:26,s:1.1,b:3}],
['Cool Tone',{t:-26,s:1.05,tb:4}],
['Soft Glow',{gl:.55,b:8,c:.92,s:1.05,f:8}],
['Moody',{c:1.22,s:.72,b:-16,t:-8,v:.55,f:6}],
['Korean Style',{b:16,c:.9,s:.88,f:12,tr:4,tb:6,gl:.2}]
].map(([n,p])=>({n,p:Object.assign({},D,p)}));
const ADJ=[['exposure','Exposure',-100,100],['brightness','Brightness',-100,100],['contrast','Contrast',-100,100],['saturation','Saturation',-100,100],['temperature','Temperature',-100,100],['blur','Blur',0,100]];
const RAT=[['Original',0],['1:1',1],['4:5',.8],['3:4',.75],['16:9',16/9],['9:16',9/16]];
const A0=()=>({exposure:0,brightness:0,contrast:0,saturation:0,temperature:0,blur:0});
const S={src:null,rot:0,flip:false,ratio:0,zoom:100,px:50,py:50,fi:0,inten:100,adj:A0(),before:false};
let R=null,bc=null,thumbCv=[],q=0;
const cv=$('#cv'),cx=cv.getContext('2d');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

function buildR(){
 const w=S.src.width,h=S.src.height,odd=S.rot%2;
 R=mk(odd?h:w,odd?w:h);const c=R.getContext('2d');
 c.translate(R.width/2,R.height/2);c.rotate(S.rot*Math.PI/2);if(S.flip)c.scale(-1,1);
 c.drawImage(S.src,-w/2,-h/2);
}
function crop(max){
 const rw=R.width,rh=R.height,a=S.ratio||rw/rh;
 let cw=rw,ch=rw/a;if(ch>rh){ch=rh;cw=rh*a}
 const z=S.zoom/100;cw/=z;ch/=z;
 const sx=(rw-cw)*S.px/100,sy=(rh-ch)*S.py/100,k=Math.min(1,max/Math.max(cw,ch));
 const o=mk(Math.max(1,Math.round(cw*k)),Math.max(1,Math.round(ch*k)));
 const c=o.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(R,sx,sy,cw,ch,0,0,o.width,o.height);return o;
}
function soften(src,f){
 const w=src.width,h=src.height,s=mk(Math.max(2,Math.round(w*f)),Math.max(2,Math.round(h*f)));
 const c=s.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(src,0,0,s.width,s.height);
 const o=mk(w,h),k=o.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(s,0,0,w,h);return o;
}
function process(base,fi,inten,A){
 const w=base.width,h=base.height;
 const src=A.blur>0?soften(base,1/(1+A.blur*.25)):base;
 const o=mk(w,h),c=o.getContext('2d');c.drawImage(src,0,0);
 const id=c.getImageData(0,0,w,h),d=id.data,P=F[fi].p,k=fi?inten/100:0;
 const ex=Math.pow(2,A.exposure/50),br=A.brightness*1.5,ct=1+A.contrast/100,sa=1+A.saturation/100,tp=A.temperature*.6;
 const hx=w/2,hy=h/2,md=Math.hypot(hx,hy),vg=P.v*k;
 let x=0,y=0;
 for(let i=0;i<d.length;i+=4){
  let r=d[i]*ex+br,g=d[i+1]*ex+br,b=d[i+2]*ex+br,l;
  r=(r-128)*ct+128;g=(g-128)*ct+128;b=(b-128)*ct+128;
  l=.299*r+.587*g+.114*b;r=l+(r-l)*sa;g=l+(g-l)*sa;b=l+(b-l)*sa;
  r+=tp;b-=tp;
  if(k>0){
   let pr=r+P.b,pg=g+P.b,pb=b+P.b;
   pr=(pr-128)*P.c+128;pg=(pg-128)*P.c+128;pb=(pb-128)*P.c+128;
   l=.299*pr+.587*pg+.114*pb;pr=l+(pr-l)*P.s;pg=l+(pg-l)*P.s;pb=l+(pb-l)*P.s;
   if(P.sep){const sr=.393*pr+.769*pg+.189*pb,sg=.349*pr+.686*pg+.168*pb,sb=.272*pr+.534*pg+.131*pb;pr+=(sr-pr)*P.sep;pg+=(sg-pg)*P.sep;pb+=(sb-pb)*P.sep}
   if(P.gray){l=.299*pr+.587*pg+.114*pb;pr+=(l-pr)*P.gray;pg+=(l-pg)*P.gray;pb+=(l-pb)*P.gray}
   pr+=P.t;pb-=P.t;
   if(P.sp){const z=((.299*pr+.587*pg+.114*pb)/255-.5)*P.sp;pr+=z;pb-=z;pg-=z*.3}
   if(P.f){const m=(255-P.f)/255;pr=P.f+pr*m;pg=P.f+pg*m;pb=P.f+pb*m}
   pr+=P.tr;pg+=P.tg;pb+=P.tb;
   r+=(pr-r)*k;g+=(pg-g)*k;b+=(pb-b)*k;
  }
  if(vg>0){const dd=Math.hypot(x-hx,y-hy)/md,f=1-vg*dd*dd*1.4;r*=f;g*=f;b*=f}
  d[i]=r;d[i+1]=g;d[i+2]=b;
  if(++x===w){x=0;y++}
 }
 c.putImageData(id,0,0);
 if(P.gl*k>0){const g=soften(o,.08);c.globalCompositeOperation='screen';c.globalAlpha=Math.min(1,P.gl*k);c.drawImage(g,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over'}
 return o;
}
function render(){
 if(!S.src)return;
 if(!bc)bc=crop(1100);
 const out=S.before?bc:process(bc,S.fi,S.inten,S.adj);
 cv.width=out.width;cv.height=out.height;cx.drawImage(out,0,0);
}
function req(){if(!q)q=requestAnimationFrame(()=>{q=0;render()})}
function geo(){bc=null;req();drawThumbs()}
function drawThumbs(){
 if(!S.src)return;
 const t=crop(110),z=A0();
 thumbCv.forEach((c,i)=>{const o=process(t,i,100,z);c.width=o.width;c.height=o.height;c.getContext('2d').drawImage(o,0,0)});
}

/* UI */
const th=$('#thumbs');
F.forEach((f,i)=>{
 const b=document.createElement('button');b.className='th'+(i?'':' on');
 const c=document.createElement('canvas');c.width=c.height=76;thumbCv.push(c);
 b.append(c,f.n);b.onclick=()=>{S.fi=i;S.inten=100;$('#inten').value=100;$('#v_inten').textContent=100;
  document.querySelectorAll('.th').forEach((e,j)=>e.classList.toggle('on',j===i));req()};
 th.append(b);
});
function slider(host,id,label,min,max,val,fn){
 const d=document.createElement('div');d.className='sl';
 d.innerHTML=`<div><span>${label}</span><b id="v_${id}">${val}</b></div><input type="range" id="${id}" min="${min}" max="${max}" value="${val}">`;
 host.append(d);const i=d.querySelector('input');
 i.oninput=()=>{$('#v_'+id).textContent=i.value;fn(+i.value)};
}
const pa=$('#p-a');
ADJ.forEach(([k,l,mn,mx])=>slider(pa,'a_'+k,l,mn,mx,0,v=>{S.adj[k]=v;req()}));
$('#inten').oninput=e=>{S.inten=+e.target.value;$('#v_inten').textContent=S.inten;req()};
const cs=$('#cs');
slider(cs,'zoom','Zoom',100,300,100,v=>{S.zoom=v;geo()});
slider(cs,'px','Posisi horizontal',0,100,50,v=>{S.px=v;geo()});
slider(cs,'py','Posisi vertikal',0,100,50,v=>{S.py=v;geo()});
const rt=$('#ratios');
RAT.forEach(([n,v],i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.textContent=n;
 b.onclick=()=>{S.ratio=v;rt.querySelectorAll('.chip').forEach((e,j)=>e.classList.toggle('on',j===i));geo()};rt.append(b)});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e===t));
 document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t.dataset.t))});
$('#rl').onclick=()=>{S.rot=(S.rot+3)%4;buildR();geo()};
$('#rr').onclick=()=>{S.rot=(S.rot+1)%4;buildR();geo()};
$('#fl').onclick=()=>{S.flip=!S.flip;buildR();geo()};

function syncUI(){
 ADJ.forEach(([k])=>{$('#a_'+k).value=S.adj[k];$('#v_a_'+k).textContent=S.adj[k]});
 [['inten',S.inten],['zoom',S.zoom],['px',S.px],['py',S.py]].forEach(([k,v])=>{$('#'+k).value=v;$('#v_'+k).textContent=v});
 document.querySelectorAll('.th').forEach((e,j)=>e.classList.toggle('on',j===S.fi));
 rt.querySelectorAll('.chip').forEach((e,j)=>e.classList.toggle('on',j===0));
}
$('#reset').onclick=()=>{
 Object.assign(S,{rot:0,flip:false,ratio:0,zoom:100,px:50,py:50,fi:0,inten:100,adj:A0()});
 buildR();syncUI();geo();toast('Foto dikembalikan seperti semula');
};

/* Before / After */
const cmp=$('#cmp'),bd=$('#badge');
const setB=v=>{S.before=v;bd.classList.toggle('on',v);req()};
cmp.addEventListener('pointerdown',e=>{e.preventDefault();setB(true)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,()=>setB(false)));
cmp.addEventListener('contextmenu',e=>e.preventDefault());

/* Upload */
const fi=$('#file');
$('#pick').onclick=$('#pick2').onclick=()=>fi.click();
fi.onchange=()=>fi.files[0]&&load(fi.files[0]);
const em=$('#empty'),st=$('#stage');
st.ondragover=e=>{e.preventDefault();em.classList.add('drag')};
st.ondragleave=()=>em.classList.remove('drag');
st.ondrop=e=>{e.preventDefault();em.classList.remove('drag');const f=e.dataTransfer.files[0];f&&load(f)};
function load(f){
 if(!f.type.startsWith('image/'))return toast('Pilih file gambar ya');
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{
  const k=Math.min(1,4096/Math.max(im.naturalWidth,im.naturalHeight));
  S.src=mk(Math.round(im.naturalWidth*k),Math.round(im.naturalHeight*k));
  S.src.getContext('2d').drawImage(im,0,0,S.src.width,S.src.height);
  URL.revokeObjectURL(u);
  Object.assign(S,{rot:0,flip:false,ratio:0,zoom:100,px:50,py:50,fi:0,inten:100,adj:A0()});
  buildR();syncUI();em.hidden=true;cv.hidden=false;
  ['#panel','#reset','#dl','#cmp'].forEach(s=>$(s).classList.remove('off'));
  geo();
 };
 im.onerror=()=>toast('Foto tidak bisa dibuka');
 im.src=u;fi.value='';
}

/* Download */
$('#dl').onclick=()=>{
 if(!S.src)return;
 toast('Memproses kualitas tinggi…');
 setTimeout(()=>{
  const out=process(crop(4096),S.fi,S.inten,S.adj),type=$('#fmt').value;
  out.toBlob(async blob=>{
   if(!blob)return toast('Gagal membuat file');
   const name='KYY-Filter-'+Date.now()+(type==='image/png'?'.png':'.jpg');
   let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
   if(d){
    try{await d.save({filename:name,data:blob});toast('Foto tersimpan ✓')}
    catch(e){if(!e||e.code!=='declined')toast('Gagal menyimpan foto')}
   }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
    toast('Foto diunduh ✓');
   }
  },type,.95);
 },30);
};
</script>
</body>
</html>
